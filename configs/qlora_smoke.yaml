model: mlx-community/Qwen2.5-1.5B-Instruct-4bit
train: true
fine_tune_type: lora

data: data/smoke
seed: 42

num_layers: 8
batch_size: 1
grad_accumulation_steps: 2
iters: 20
val_batches: -1
learning_rate: 1.0e-5
steps_per_report: 1
steps_per_eval: 10

adapter_path: artifacts/stage5a/adapter
save_every: 20
test: false

max_seq_length: 1024
grad_checkpoint: false
mask_prompt: false

lora_parameters:
  keys:
    - self_attn.q_proj
    - self_attn.k_proj
    - self_attn.v_proj
    - self_attn.o_proj
    - mlp.gate_proj
    - mlp.up_proj
    - mlp.down_proj
  rank: 8
  scale: 16.0
  dropout: 0.0
